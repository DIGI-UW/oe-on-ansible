---
- name: Ensure node_exporter project directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_project_dir }}"
    state: directory
    mode: "0755"

- name: Render node_exporter docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ node_exporter_project_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Recreate node_exporter stack

- name: Bring node_exporter stack up
  community.docker.docker_compose_v2:
    project_src: "{{ node_exporter_project_dir }}"
    state: present
    remove_orphans: true

- name: Allow node_exporter port from monitoring hosts
  community.general.ufw:
    rule: allow
    src: "{{ hostvars[item].ansible_host }}"
    port: "{{ node_exporter_port | string }}"
    proto: tcp
  loop: "{{ groups['monitoring'] | default([]) }}"
