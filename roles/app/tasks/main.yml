---
- name: Ensure compose project directory exists
  ansible.builtin.file:
    path: "{{ compose_project_root }}/{{ compose_stack.name }}"
    state: directory
    mode: "0755"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ compose_project_root }}/{{ compose_stack.name }}/docker-compose.yml"
    mode: "0644"
  notify: Recreate compose stack

- name: Bring compose stack up
  community.docker.docker_compose_v2:
    project_src: "{{ compose_project_root }}/{{ compose_stack.name }}"
    state: present
    remove_orphans: true
