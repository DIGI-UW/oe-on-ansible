---
compose_stack:
  name: web
  services:
    nginx:
      image: nginx:1.27-alpine
      restart: unless-stopped
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./data/nginx:/etc/nginx/conf.d:ro
    app:
      image: ghcr.io/example/app:latest
      restart: unless-stopped
      environment:
        APP_ENV: "{{ app_env }}"
      expose:
        - "8080"
